version: 2
updates:
  # Dépendances npm : une PR groupée par semaine pour les mises à jour mineures et correctives
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Les types Node doivent correspondre à la version de Node qui exécute le site (22)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 n'est pas encore supporté par typescript-eslint (utilisé par ESLint) ;
      # à retirer quand typescript-eslint l'annoncera compatible
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Actions GitHub du workflow CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
